version: '3.8'

services:
  websocket-server:
    build: .
    container_name: websocket-server
    ports:
      - "8000:8000"
    environment:
      - INSTANCE_ID=local-dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - websocket-net

networks:
  websocket-net:
    driver: bridge